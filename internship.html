<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Internship Application Form submitted by Khushi Murarka for NeuroNexus Task">
  <meta name="keywords" content="internship, application form, NeuroNexus, Khushi Murarka">
  <meta name="author" content="Khushi Murarka">
  <title>NeuroNexus Internship Application</title>
  <style>
    :root {
      --primary: #4361ee;
      --primary-dark: #3a56d4;
      --text: #2b2d42;
      --light-gray: #f8f9fa;
      --gray: #e9ecef;
      --dark-gray: #adb5bd;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--light-gray);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .form-container {
      background-color: var(--white);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: var(--shadow);
      max-width: 500px;
      width: 100%;
      transition: transform 0.3s ease;
    }

    .form-container:hover {
      transform: translateY(-2px);
    }

    .logo {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .form-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-header h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: var(--text);
    }

    .form-header p {
      color: var(--dark-gray);
      font-size: 0.875rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--gray);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.875rem;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .radio-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .radio-option {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .radio-option input {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--dark-gray);
      border-radius: 50%;
      margin-right: 0.5rem;
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .radio-option input:checked {
      border-color: var(--primary);
    }

    .radio-option input:checked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background-color: var(--primary);
      border-radius: 50%;
    }

    .radio-option label {
      margin-bottom: 0;
      font-weight: 400;
      cursor: pointer;
    }

    button[type="submit"] {
      width: 100%;
      background-color: var(--primary);
      color: var(--white);
      padding: 0.875rem;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 1rem;
    }

    button[type="submit"]:hover {
      background-color: var(--primary-dark);
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--dark-gray);
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      
      .form-container {
        padding: 1.5rem;
      }
      
      .radio-group {
        flex-direction: column;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <form class="form-container">
    <div class="logo">KM</div>
    <div class="form-header">
      <h2>Internship Application</h2>
      <p>Submitted by Khushi Murarka for NeuroNexus Task</p>
    </div>

    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" required>
    </div>

    <div class="form-group">
      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" name="contact" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="company">Company Name (if applicable)</label>
      <input type="text" id="company" name="company">
    </div>

    <div class="form-group">
      <label for="address">Address</label>
      <textarea id="address" name="address" required></textarea>
    </div>

    <div class="form-group">
      <label for="department">Department</label>
      <select id="department" name="department">
        <option value="" disabled selected>Select department</option>
        <option value="HR">HR</option>
        <option value="Sales">Sales</option>
        <option value="Development">Development</option>
        <option value="Marketing">Marketing</option>
        <option value="Others">Others</option>
      </select>
    </div>

    <div class="form-group">
      <label>Gender</label>
      <div class="radio-group">
        <div class="radio-option">
          <input type="radio" id="male" name="gender" value="Male" required>
          <label for="male">Male</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="female" name="gender" value="Female">
          <label for="female">Female</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="nonbinary" name="gender" value="Non-binary">
          <label for="nonbinary">Non-binary</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="preferNotSay" name="gender" value="Prefer not to say">
          <label for="preferNotSay">Prefer not to say</label>
        </div>
      </div>
    </div>

    <button type="submit">Submit Application</button>
  </form>

  <footer>Designed with ♥ by Khushi Murarka</footer>

</body>
</html>
